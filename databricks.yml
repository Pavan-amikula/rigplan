bundle:
  name: rigplan

variables:
  cluster_id:
    description: Existing Unity Catalog enabled cluster; Python 3.11+ and SciPy MILP required
  volume_root:
    default: /Volumes/main/rigplan/artifacts
  catalog:
    default: main
  schema:
    default: rigplan

artifacts:
  wheel:
    type: whl
    build: python -m pip wheel . --no-deps --wheel-dir dist
    path: .

resources:
  jobs:
    rigplan_benchmark:
      name: rigplan-retrospective-benchmark
      max_concurrent_runs: 1
      tasks:
        - task_key: benchmark
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: ./databricks/rigplan_job.py
            base_parameters:
              root: ${var.volume_root}
              catalog: ${var.catalog}
              schema: ${var.schema}
          libraries:
            - whl: ./dist/*.whl

targets:
  dev:
    mode: development
    default: true
