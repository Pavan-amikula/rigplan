[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rigplan"
version = "1.0.0"
description = "Requirement-aware experimental design for physical rig campaigns"
authors = [{name = "Amikula Pavan Kumar Goud"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "streamlit>=1.50,<2", "pyarrow>=18,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/Pavan-amikula/rigplan"
Documentation = "https://github.com/Pavan-amikula/rigplan#readme"
"Interactive results" = "https://pavan-amikula.github.io/rigplan/"

[project.scripts]
rigplan = "rigplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
